server:
  port: 8082


spring:
  application:
    name: email-service

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: email-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.meexora.common.kafka,com.meexora.common.dto"

  mail:
    host: smtp.gmail.com
    port: 587
    username: meexora.app@gmail.com
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

kafka:
  topic:
    user-registration-request: user-registration-request
    user-forgot-password-request: user-forgot-password-request
    ticket-email: ticket-email
    booking-refund: booking-refund
    watching-booking-update: watching-booking-update